name: Test

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - base/*
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
